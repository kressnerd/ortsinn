[package]
name = "benchmark"
version = "0.1.0"
edition = "2024"

[lib]
name = "benchmark"
path = "src/lib.rs"

[[bin]]
name = "benchmark"
path = "src/main.rs"

[[test]]
name = "benchmark_features"
path = "tests/benchmark_features.rs"
harness = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
tokio = { version = "1.54.0", features = ["full"] }

[dev-dependencies]
cucumber = "0.23.0"
