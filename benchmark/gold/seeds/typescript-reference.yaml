# Reviewed gold seeds for the primary TypeScript reference repository.
#
# The proposer resolves each seed against the fixed checkout
# (work/repos/typescript-reference) and derives the five gold files. A seed
# must name a documented top-level `export function`; the seed file is the
# reviewed intent, the checkout is the reviewed location. `concept` and
# `equivalence` are the reviewed concept queries; `natural_language` overrides
# the derived question where two definitions share documentation.

repository: typescript-reference
language: typescript
seeds:
  # parser.ts
  - path: src/compiler/parser.ts
    symbol: forEachChild
    concept: iteration over each syntax tree child
    equivalence: visiting every child node of a node
  - path: src/compiler/parser.ts
    symbol: forEachChildRecursively
    concept: recursive traversal of syntax tree children
    equivalence: walking all descendant nodes of a node
    natural_language: Where is the code that walks every nested child of a syntax tree node?
  - path: src/compiler/parser.ts
    symbol: parseJsonText
    concept: parsing JSON into a syntax tree
    equivalence: turning JSON text into a source file
  # utilitiesPublic.ts — public node predicates
  - path: src/compiler/utilitiesPublic.ts
    symbol: normalizeSpans
    concept: sorting and merging text spans
    equivalence: canonical ordering of text spans
  - path: src/compiler/utilitiesPublic.ts
    symbol: collapseTextChangeRangesAcrossMultipleVersions
    concept: merging text change ranges across versions
    equivalence: combining edits from several script snapshot versions
  - path: src/compiler/utilitiesPublic.ts
    symbol: findAncestor
    concept: searching the parent chain for a node
    equivalence: locating an enclosing node by walking up parents
  - path: src/compiler/utilitiesPublic.ts
    symbol: isParseTreeNode
    concept: origin of a node in the parse tree
    equivalence: checking that a node came from parsing
  - path: src/compiler/utilitiesPublic.ts
    symbol: getParseTreeNode
    concept: recovering the original parse tree node
    equivalence: unwrapping a transformed node to its parsed form
  - path: src/compiler/utilitiesPublic.ts
    symbol: unescapeLeadingUnderscores
    concept: unescaping leading underscores in identifier text
    equivalence: removing the escaped underscore prefix from a name
  # program.ts
