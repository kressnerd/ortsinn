    symbol: getModeForFileReference
    concept: resolution mode for a module reference
    equivalence: deciding how a file reference should resolve
  - path: src/compiler/program.ts
    symbol: getModeForUsageLocation
    concept: resolution mode for a module usage
    equivalence: deciding how an import usage should resolve
  - path: src/compiler/program.ts
    symbol: isProgramUptoDate
    concept: checking whether a program can be reused
    equivalence: detecting an outdated program structure
  - path: src/compiler/program.ts
    symbol: getImpliedNodeFormatForFile
    concept: implied module format of a file
    equivalence: deciding whether a file is ESM or CommonJS
  - path: src/compiler/program.ts
    symbol: resolveProjectReferencePath
    concept: resolving a project reference config path
    equivalence: finding the tsconfig of a referenced project
  - path: src/compiler/program.ts
    symbol: getResolutionDiagnostic
    concept: diagnostic for an unemitted module resolution
    equivalence: reporting why a resolved module is excluded
  - path: src/compiler/program.ts
    symbol: createProgram
    concept: creating a compiler program
    equivalence: building a program from root files and options
